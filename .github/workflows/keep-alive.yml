name: Wake Up Streamlit App

on:
  schedule:
    # 매일 아침 6시(한국 시간)에 자동으로 실행됩니다. (UTC 21:00)
    - cron: "0 21 * * *"
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Sleep-Prevention Script
        run: |
          python -c "
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new-page()
              
              print('Streamlit 앱 접속 중...')
              page.goto('https://emg-learning.streamlit.app')
              time.sleep(5)  # 페이지 로딩 대기
              
              # 'Yes, get this app back up!' 버튼이 있는지 찾고 있으면 클릭합니다.
              button = page.locator('button:has-text(\"Yes, get this app back up!\")')
              if button.count() > 0:
                  print('잠자기 상태 감지! 깨우기 버튼을 누릅니다.')
                  button.click()
                  time.sleep(15)  # 앱이 부팅될 때까지 15초 대기
                  print('앱 깨우기 성공!')
              else:
                  print('앱이 이미 깨어있습니다.')
                  
              browser.close()
          "

      # 60일 동안 커밋이 없어도 GitHub 스케줄러가 멈추지 않도록 방지
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v1
